<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MediQueue — Profile</title>
<link rel="icon" href="../assets/images/logo-icon.png" type="image/png" />
<link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <div class="sidebar" id="sidebar"></div>
    <div class="main">
      <div class="topbar">
        <span class="role-badge" id="roleBadge"></span>
        <div class="topbar-right">
          <div class="bell-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <div class="bell-dot"></div>
          </div>
          <div class="user-block">
            <div class="avatar" id="avatarIcon"></div>
            <div><div class="user-name" id="userName"></div><div class="user-role" id="userRole"></div></div>
          </div>
        </div>
      </div>
      <div class="content">
        <div class="page-header">
          <div><h1 class="page-title font-display">Profile settings</h1><div class="page-sub">Update your contact details and password</div></div>
        </div>

<div class="panel profile-card">
  <div style="padding:24px;">
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:6px;">
      <div class="profile-avatar-lg" id="avatarInitials" style="margin-bottom:0;font-weight:800;font-size:20px;font-family:'Zilla Slab',Georgia,serif;"></div>
      <div>
        <div id="profileNameHeading" style="font-size:17px;font-weight:700;color:var(--ink);"></div>
        <div id="profileRoleTag" style="font-size:12.5px;color:var(--slate);"></div>
      </div>
    </div>

    <div style="display:flex;gap:20px;flex-wrap:wrap;padding:14px 0 18px;border-bottom:1px solid var(--line);margin-bottom:18px;">
      <div><div style="font-size:11px;color:var(--slate);text-transform:uppercase;letter-spacing:0.04em;">Clinic</div><div id="profileClinic" style="font-size:13.5px;font-weight:600;margin-top:2px;"></div></div>
      <div><div style="font-size:11px;color:var(--slate);text-transform:uppercase;letter-spacing:0.04em;">Department</div><div id="profileDept" style="font-size:13.5px;font-weight:600;margin-top:2px;"></div></div>
      <div><div style="font-size:11px;color:var(--slate);text-transform:uppercase;letter-spacing:0.04em;">Staff since</div><div id="profileJoinDate" style="font-size:13.5px;font-weight:600;margin-top:2px;"></div></div>
    </div>
    <div style="font-size:12px;color:var(--slate);margin-bottom:18px;">Clinic and department are managed by an administrator — contact yours to change these.</div>

    <div class="profile-success" id="successMsg">Saved successfully.</div>

    <form id="profileForm">
      <div class="field"><label for="pName">Full name</label><input class="input" id="pName" required /></div>
      <div class="field"><label for="pEmail">Email</label><input class="input" id="pEmail" type="email" required /></div>
      <div class="field"><label for="pPhone">Phone</label><input class="input" id="pPhone" required /></div>
      <button type="submit" class="btn btn-primary" style="margin-top:6px;">Save changes</button>
    </form>

    <div class="profile-section-title">Change password</div>
    <form id="passwordForm">
      <div class="field"><label for="pwCurrent">Current password</label><input class="input" id="pwCurrent" type="password" placeholder="Enter current password" /></div>
      <div class="field"><label for="pwNew">New password</label><input class="input" id="pwNew" type="password" placeholder="Enter new password" /></div>
      <div class="field"><label for="pwConfirm">Confirm new password</label><input class="input" id="pwConfirm" type="password" placeholder="Re-enter new password" /></div>
      <button type="submit" class="btn btn-ghost" style="margin-top:6px;">Update password</button>
    </form>
  </div>
</div>
      </div>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/render-helpers.js"></script>
  <script src="../js/pages/profile.js"></script>
</body>
</html>
