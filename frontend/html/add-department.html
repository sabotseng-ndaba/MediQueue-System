<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Department | MediQueue</title>

    <link rel="stylesheet" href="../css/style1.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<!-- ================= SIDEBAR ================= -->

<div class="sidebar">

    <div class="logo">
        <img src="../images/logo.png" alt="MediQueue Logo">
    </div>

    <div class="menu">

        <a href="admindashboard.html">
            <i class="fa-solid fa-table-columns"></i>
            Dashboard
        </a>

        <a href="clinic.html">
            <i class="fa-solid fa-hospital"></i>
            Clinics
        </a>

        <a href="add-department.html" class="active">
            <i class="fa-solid fa-building"></i>
            Departments
        </a>

        <a href="login.html">
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout
        </a>

    </div>

</div>

<!-- ================= TOPBAR ================= -->

<div class="topbar">

    <h2>Add New Department</h2>

    <div class="user">

        <div class="avatar">
            SA
        </div>

        <div>
            <strong>Sabo Admin</strong><br>
            <small>System Administrator</small>
        </div>

    </div>

</div>

<!-- ================= MAIN ================= -->

<div class="main">

    <div class="card">

        <h3 class="card-title">
            Department Information
        </h3>

        <form action="department-success.html">

            <div class="form-group">
                <label>Department Name</label>
                <input
                    type="text"
                    placeholder="Enter department name"
                    required>
            </div>

            <div class="form-group">
                <label>Department Code</label>
                <input
                    type="text"
                    placeholder="Enter department code"
                    required>
            </div>

            <div class="form-group">
                <label>Select Clinic</label>

                <select required>
                    <option value="">Select Clinic</option>
                    <option>District Six Clinic</option>
                    <option>Bellville Clinic</option>
                    <option>Khayelitsha Clinic</option>
                    <option>Mitchells Plain Clinic</option>
                </select>
            </div>

            <div class="form-group">
                <label>Department Description</label>
                <textarea
                    rows="4"
                    placeholder="Enter department description"></textarea>
            </div>

            <div class="form-group">
                <label>Department Head</label>
                <input
                    type="text"
                    placeholder="Enter department head">
            </div>

            <div class="form-group">
                <label>Contact Number</label>
                <input
                    type="tel"
                    placeholder="Enter contact number">
            </div>

            <div class="form-group">
                <label>Department Status</label>

                <select required>
                    <option value="">Select Status</option>
                    <option>Active</option>
                    <option>Inactive</option>
                </select>
            </div>

            <div class="button-group">

                <button
                    type="submit"
                    class="btn btn-primary">

                    <i class="fa-solid fa-floppy-disk"></i>
                    Save Department

                </button>

                <button
                    type="reset"
                    class="btn btn-secondary">

                    <i class="fa-solid fa-arrow-rotate-left"></i>
                    Reset

                </button>

            </div>

        </form>

    </div>

</div>

<script src="../js/script1.js"></script>

</body>
</html>
