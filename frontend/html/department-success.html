<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Created Successfully | MediQueue</title>

    <link rel="stylesheet" href="../css/style1.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<!-- ================= SIDEBAR ================= -->

<div class="sidebar">

    <div class="logo">
        <img src="../images/logo.png" alt="MediQueue Logo">
    </div>

    <div class="menu">

        <a href="dashboard.html">
            <i class="fa-solid fa-table-columns"></i>
            Dashboard
        </a>

        <a href="clinic.html">
            <i class="fa-solid fa-hospital"></i>
            Clinics
        </a>

        <a href="department.html" class="active">
            <i class="fa-solid fa-building"></i>
            Departments
        </a>

        <a href="login.html">
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout
        </a>

    </div>

</div>

<!-- ================= TOPBAR ================= -->

<div class="topbar">

    <h2>Department Created Successfully</h2>

    <div class="user">

        <div class="avatar">
            SA
        </div>

        <div>
            <strong>Sabo Admin</strong><br>
            <small>System Administrator</small>
        </div>

    </div>

</div>

<!-- ================= MAIN CONTENT ================= -->

<div class="main">

    <div class="card success-box">

        <div class="success-icon">
            <i class="fa-solid fa-circle-check"></i>
        </div>

        <h2>Department Created Successfully!</h2>

        <p style="margin-bottom:30px; color:#666;">
            The department has been added successfully and is now available in the MediQueue system.
        </p>

        <div class="button-group" style="justify-content:center;">

            <button
                class="btn btn-primary"
                onclick="location.href='department.html'">

                <i class="fa-solid fa-list"></i>
                View Departments

            </button>

            <button
                class="btn btn-secondary"
                onclick="location.href='add-department.html'">

                <i class="fa-solid fa-plus"></i>
                Add Another Department

            </button>

            <button
                class="btn btn-secondary"
                onclick="location.href='dashboard.html'">

                <i class="fa-solid fa-house"></i>
                Dashboard

            </button>

        </div>

    </div>

</div>

<script src="../js/script1.js"></script>

</body>
</html>
