<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add Queue Entry — MediQueue</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="add-entry">
  <header class="app-header">
    <div class="header-top">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">MQ</div>
        <div>
          <p class="brand-name">MediQueue</p>
          <p class="brand-sub">Queue Management</p>
        </div>
      </div>
      <div class="header-user">
        <span style="color:var(--muted-fg);">L. LALELA</span>
        <span class="role-pill">Role: Administrator</span>
      </div>
    </div>
    <nav class="tab-bar" aria-label="Primary">
      <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="queue-entries.html">Queue Entries</a></li>
        <li><a href="add-entry.html" class="active">Add Queue Entry</a></li>
        <li><a href="roles.html">Role Management</a></li>
      </ul>
    </nav>
  </header>
  <main class="container" style="max-width:720px;">
    <div class="page-head">
      <h1>Add Queue Entry</h1>
      <p id="queue-info"></p>
    </div>

    <form id="entry-form" class="card" novalidate>
      <div class="form-grid">
        <!-- Patient search -->
        <div class="field">
          <label class="required">Patient</label>
          <div id="patient-search-wrap" class="search-wrap">
            <input id="patient-search" type="search" autocomplete="off" maxlength="60"
                   placeholder="Search by patient ID or name..." />
          </div>
          <div id="patient-results" class="patient-results" style="display:none;"></div>

          <div id="patient-selected" class="patient-selected" style="display:none;">
            <div>
              <p class="sel-name" style="font-weight:600;"></p>
              <p class="sel-meta" style="font-family:var(--font-mono);font-size:11px;color:var(--muted-fg);margin-top:2px;"></p>
            </div>
            <button type="button" id="clear-patient" class="btn btn-ghost btn-sm" aria-label="Clear">✕</button>
          </div>

          <p id="patient-error" class="err">Please select a patient.</p>
        </div>

        
        <div class="stats">
          <div>
            <p class="stat-label">Queue Number</p>
            <p class="stat-value-lg" id="auto-queue-num"></p>
          </div>
          <div>
            <p class="stat-label">Check-in Time</p>
            <p class="stat-value-lg" id="auto-checkin"></p>
          </div>
          <div>
            <p class="stat-label">Queue</p>
            <p class="stat-value-lg" id="auto-queue-id"></p>
          </div>
        </div>

        
        <div class="two-col">
          <div class="field">
            <label class="required" for="priority">Priority Level</label>
            <select id="priority">
              <option value="normal">Normal</option>
              <option value="emergency">Emergency</option>
            </select>
            <div style="margin-top:8px;" id="priority-preview"></div>
          </div>
          <div class="field">
            <label class="required" for="status">Initial Status</label>
            <select id="status">
              <option value="waiting">Waiting</option>
              <option value="in_consult">In Consult</option>
            </select>
            <div style="margin-top:8px;" id="status-preview"></div>
          </div>
        </div>
      </div>

      <div class="card-footer" style="justify-content:flex-end;">
        <a href="dashboard.html" class="btn btn-outline">Cancel</a>
        <button type="submit" class="btn">Save Entry</button>
      </div>
    </form>
  </main>
  <footer class="app-footer">
    <div class="container">MediQueue · Group IM2 · MediQueue Clinic Management System</div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
